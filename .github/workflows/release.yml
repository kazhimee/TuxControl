name: Build release packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install package builders
        run: |
          sudo apt-get update
          sudo apt-get install --yes dpkg-dev rpm
      - name: Build .deb, .rpm, .tar.gz and portable archive
        run: packaging/build-all.sh "${GITHUB_REF_NAME#v}"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
