name: Build release packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  deb-rpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install package builders
        run: |
          sudo apt-get update
          sudo apt-get install --yes dpkg-dev rpm
      - name: Build Debian and RPM packages
        run: |
          version="${GITHUB_REF_NAME#v}"
          packaging/build-deb.sh "$version"
          packaging/build-rpm.sh "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: deb-rpm
          path: dist/*
          if-no-files-found: error

  arch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Arch package in Arch Linux
        run: |
          version="${GITHUB_REF_NAME#v}"
          packaging/build-arch.sh "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [deb-rpm, arch]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
