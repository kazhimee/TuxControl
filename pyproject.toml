[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tuxcontrol"
version = "0.1.0"
description = "An open-source GNOME control center for apps, services, themes, and extensions"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Kazhime Kagemori", email = "kazhimee@gmail.com" }]
maintainers = [{ name = "Kazhime Kagemori", email = "kazhimeofficial@gmail.com" }]
dependencies = []
classifiers = [
  "Environment :: X11 Applications :: GTK",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]

[project.scripts]
tuxcontrol = "control_center.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/applications" = ["org.tuxcontrol.App.desktop"]
